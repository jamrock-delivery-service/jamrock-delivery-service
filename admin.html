<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JAMROCK Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    header h1 {
      font-size: 22px;
    }

    header p {
      margin-top: 5px;
      opacity: 0.8;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 20px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      padding: 13px 20px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      background: #f3f4f6;
      display: none;
    }

    .shipment {
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
        margin: 15px auto;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>JAMROCK DELIVERY SERVICE</h1>
  <p>Admin Dashboard</p>
</header>

<div class="container">

  <!-- Create Shipment -->
  <div class="card">
    <h2>Create Shipment</h2>

    <input
      type="text"
      id="trackingNumber"
      placeholder="Tracking Number"
    >

    <input
      type="text"
      id="sender"
      placeholder="Sender Name"
    >

    <input
      type="text"
      id="receiver"
      placeholder="Receiver Name"
    >

    <input
      type="text"
      id="origin"
      placeholder="Origin"
    >

    <input
      type="text"
      id="destination"
      placeholder="Destination"
    >

    <input
      type="text"
      id="estimatedDelivery"
      placeholder="Estimated Delivery"
    >

    <button onclick="createShipment()">
      Create Shipment
    </button>

    <div id="result"></div>
  </div>

  <!-- Update Shipment -->
  <div class="card">
    <h2>Update Shipment</h2>

    <input
      type="text"
      id="updateTracking"
      placeholder="Tracking Number"
    >

    <select id="status">
      <option value="Shipment Created">Shipment Created</option>
      <option value="Picked Up">Picked Up</option>
      <option value="In Transit">In Transit</option>
      <option value="Arrived at Destination">Arrived at Destination</option>
      <option value="Out for Delivery">Out for Delivery</option>
      <option value="Delivered">Delivered</option>
    </select>

    <input
      type="text"
      id="updateDelivery"
      placeholder="Estimated Delivery"
    >

    <button onclick="updateShipment()">
      Update Shipment
    </button>

    <div id="updateResult"></div>
  </div>

</div>

<script>

async function createShipment() {

  const data = {
    trackingNumber:
      document.getElementById("trackingNumber").value,

    sender:
      document.getElementById("sender").value,

    receiver:
      document.getElementById("receiver").value,

    origin:
      document.getElementById("origin").value,

    destination:
      document.getElementById("destination").value,

    estimatedDelivery:
      document.getElementById("estimatedDelivery").value
  };

  try {

    const response = await fetch("/api/shipments", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(data)
    });

    const result = await response.json();

    const box = document.getElementById("result");

    box.style.display = "block";

    if (result.success) {
      box.innerHTML =
        "<strong>Shipment created successfully.</strong><br>" +
        "Tracking Number: " +
        result.shipment.trackingNumber;
    } else {
      box.innerHTML = result.message;
    }

  } catch (error) {

    document.getElementById("result").style.display = "block";

    document.getElementById("result").innerHTML =
      "Server connection failed.";
  }
}


async function updateShipment() {

  const tracking =
    document.getElementById("updateTracking").value;

  const status =
    document.getElementById("status").value;

  const estimatedDelivery =
    document.getElementById("updateDelivery").value;

  try {

    const response = await fetch(
      "/api/shipments/" + tracking,
      {
        method: "PATCH",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          status: status,
          estimatedDelivery: estimatedDelivery
        })
      }
    );

    const result = await response.json();

    const box =
      document.getElementById("updateResult");

    box.style.display = "block";

    if (result.success) {

      box.innerHTML =
        "<strong>Shipment updated successfully.</strong><br>" +
        "Status: " +
        result.shipment.status;

    } else {

      box.innerHTML = result.message;

    }

  } catch (error) {

    document.getElementById("updateResult").style.display =
      "block";

    document.getElementById("updateResult").innerHTML =
      "Server connection failed.";

  }

}

</script>

</body>
  </html>
