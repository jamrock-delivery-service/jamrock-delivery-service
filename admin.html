<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JAMROCK Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 6%;
    }

    header h1 {
      font-size: 23px;
    }

    header p {
      margin-top: 5px;
      color: #d1d5db;
      font-size: 14px;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-bottom: 20px;
      font-size: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select {
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    select:focus {
      border-color: #111827;
    }

    button {
      border: none;
      padding: 13px 20px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary-btn {
      background: #111827;
      color: white;
      margin-top: 20px;
    }

    .primary-btn:hover {
      background: #374151;
    }

    .shipment {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .shipment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tracking-number {
      font-size: 18px;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: #111827;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .shipment-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 14px;
      color: #4b5563;
    }

    .shipment-actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .update-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .delete-btn {
      background: #b91c1c;
      color: white;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 20px;
      background: #ecfdf5;
      color: #065f46;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 25px;
    }

    @media (max-width: 700px) {

      .container {
        width: 94%;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .shipment-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .shipment-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>JAMROCK DELIVERY SERVICE</h1>
    <p>Shipment Administration Dashboard</p>
  </header>


  <main class="container">

    <!-- CREATE SHIPMENT -->

    <div class="card">

      <h2>Create New Shipment</h2>

      <div id="message" class="message"></div>

      <form id="shipmentForm">

        <div class="form-grid">

          <div class="form-group">
            <label>Tracking Number</label>

            <input
              type="text"
              id="trackingNumber"
              placeholder="Example: JAM100002"
              required
            >
          </div>


          <div class="form-group">
            <label>Sender</label>

            <input
              type="text"
              id="sender"
              placeholder="Sender name"
              value="JAMROCK DELIVERY SERVICE"
            >
          </div>


          <div class="form-group">
            <label>Receiver</label>

            <input
              type="text"
              id="receiver"
              placeholder="Receiver name"
              required
            >
          </div>


          <div class="form-group">
            <label>Origin</label>

            <input
              type="text"
              id="origin"
              placeholder="Example: Lagos, Nigeria"
              required
            >
          </div>


          <div class="form-group">
            <label>Destination</label>

            <input
              type="text"
              id="destination"
              placeholder="Example: London, UK"
              required
            >
          </div>


          <div class="form-group">
            <label>Estimated Delivery</label>

            <input
              type="date"
              id="estimatedDelivery"
            >
          </div>

        </div>


        <button
          type="submit"
          class="primary-btn"
        >
          Create Shipment
        </button>

      </form>

    </div>


    <!-- SHIPMENT LIST -->

    <div class="card">

      <h2>All Shipments</h2>

      <div id="shipmentList">

        <div class="empty">
          Loading shipments...
        </div>

      </div>

    </div>

  </main>


  <script>

    /* LOAD ALL SHIPMENTS */

    async function loadShipments() {

      const shipmentList =
        document.getElementById("shipmentList");

      try {

        const response =
          await fetch("/api/shipments");

        const data =
          await response.json();

        if (!data.success) {
          throw new Error("Unable to load shipments.");
        }

        if (data.shipments.length === 0) {

          shipmentList.innerHTML =
            '<div class="empty">No shipments found.</div>';

          return;
        }


        shipmentList.innerHTML = "";


        data.shipments.forEach(shipment => {

          const shipmentElement =
            document.createElement("div");

          shipmentElement.className =
            "shipment";


          shipmentElement.innerHTML = `

            <div class="shipment-header">

              <div class="tracking-number">
                ${escapeHtml(shipment.trackingNumber)}
              </div>

              <div class="status">
                ${escapeHtml(shipment.status)}
              </div>

            </div>


            <div class="shipment-details">

              <div>
                <strong>Sender:</strong>
                ${escapeHtml(shipment.sender)}
              </div>

              <div>
                <strong>Receiver:</strong>
                ${escapeHtml(shipment.receiver)}
              </div>

              <div>
                <strong>Origin:</strong>
                ${escapeHtml(shipment.origin)}
              </div>

              <div>
                <strong>Destination:</strong>
                ${escapeHtml(shipment.destination)}
              </div>

              <div>
                <strong>Estimated Delivery:</strong>
                ${escapeHtml(shipment.estimatedDelivery)}
              </div>

            </div>


            <div class="shipment-actions">

              <button
                class="update-btn"
                onclick="updateShipment('${escapeJs(shipment.trackingNumber)}')"
              >
                Update Status
              </button>


              <button
                class="delete-btn"
                onclick="deleteShipment('${escapeJs(shipment.trackingNumber)}')"
              >
                Delete
              </button>

            </div>

          `;


          shipmentList.appendChild(
            shipmentElement
          );

        });

      }

      catch (error) {

        shipmentList.innerHTML =
          '<div class="empty">Unable to connect to the server.</div>';

        console.error(error);

      }

    }


    /* CREATE SHIPMENT */

    document
      .getElementById("shipmentForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();


        const trackingNumber =
          document
            .getElementById("trackingNumber")
            .value
            .trim();

        const sender =
          document
            .getElementById("sender")
            .value
            .trim();

        const receiver =
          document
            .getElementById("receiver")
            .value
            .trim();

        const origin =
          document
            .getElementById("origin")
            .value
            .trim();

        const destination =
          document
            .getElementById("destination")
            .value
            .trim();

        const estimatedDelivery =
          document
            .getElementById("estimatedDelivery")
            .value;


        try {

          const response =
            await fetch("/api/shipments", {

              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({

                trackingNumber,
                sender,
                receiver,
                origin,
                destination,
                estimatedDelivery

              })

            });


          const data =
            await response.json();


          if (!response.ok) {

            alert(
              data.message ||
              "Unable to create shipment."
            );

            return;
          }


          showMessage(
            "Shipment created successfully."
          );


          document
            .getElementById("shipmentForm")
            .reset();


          document
            .getElementById("sender")
            .value =
            "JAMROCK DELIVERY SERVICE";


          loadShipments();

        }

        catch (error) {

          alert(
            "Unable to connect to the server."
          );

          console.error(error);

        }

      });


    /* UPDATE SHIPMENT */

    async function updateShipment(trackingNumber) {

      const status =
        prompt(
          "Enter the new shipment status:\n\n" +
          "Shipment Created\n" +
          "Picked Up\n" +
          "In Transit\n" +
          "Out for Delivery\n" +
          "Delivered"
        );


      if (!status) {
        return;
      }


      const estimatedDelivery =
        prompt(
          "Enter estimated delivery date (YYYY-MM-DD):"
        );


      try {

        const response =
          await fetch(
            "/api/shipments/" +
            encodeURIComponent(trackingNumber),
            {

              method: "PATCH",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({

                status,
                estimatedDelivery

              })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          alert(
            data.message ||
            "Unable to update shipment."
          );

          return;
        }


        alert(
          "Shipment updated successfully."
        );


        loadShipments();

      }

      catch (error) {

        alert(
          "Unable to connect to the server."
        );

        console.error(error);

      }

    }


    /* DELETE SHIPMENT */

    async function deleteShipment(trackingNumber) {

      const confirmed =
        confirm(
          "Are you sure you want to delete shipment " +
          trackingNumber +
          "?"
        );


      if (!confirmed) {
        return;
      }


      try {

        const response =
          await fetch(
            "/api/shipments/" +
            encodeURIComponent(trackingNumber),
            {
              method: "DELETE"
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          alert(
            data.message ||
            "Unable to delete shipment."
          );

          return;
        }


        alert(
          "Shipment deleted successfully."
        );


        loadShipments();

      }

      catch (error) {

        alert(
          "Unable to connect to the server."
        );

        console.error(error);

      }

    }


    /* SUCCESS MESSAGE */

    function showMessage(text) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.style.display = "block";


      setTimeout(() => {

        message.style.display = "none";

      }, 4000);

    }


    /* SECURITY HELPERS */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function escapeJs(value) {

      return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

    }


    /* START */

    loadShipments();

  </script>

</body>
</html>
