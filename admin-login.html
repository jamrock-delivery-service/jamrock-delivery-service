<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAMROCK Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 8px;
      color: #111827;
    }

    p {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      color: #c00;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>JAMROCK</h1>
    <p>Administrator Login</p>

    <input
      type="text"
      id="username"
      placeholder="Username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Sign In
    </button>

    <div id="message"></div>

  </div>

  <script>
    function login() {
      const username =
        document.getElementById("username").value;

      const password =
        document.getElementById("password").value;

      /*
        Temporary demonstration only.
        We will replace this with secure
        server-side authentication later.
      */

      if (username === "admin" && password === "CHANGE_ME") {
        window.location.href = "admin.html";
      } else {
        document.getElementById("message").textContent =
          "Invalid login details.";
      }
    }
  </script>

</body>
</html>
